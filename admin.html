<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZORTHIQ Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #080808;
  --card: #141414;
  --border: #2a2a2a;
  --silver: #C0C0C0;
  --muted: #666;
  --white: #F0EDE8;
  --green: #22c55e;
  --red: #ef4444;
}
body { background: var(--bg); color: var(--white); font-family: 'Inter', sans-serif; min-height: 100vh; }
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@300;400;500&display=swap');

/* ── LOGIN ── */
#login-screen {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg);
}
.login-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 40px;
  width: min(90vw, 360px);
  text-align: center;
}
.login-logo {
  font-family: 'Rajdhani', sans-serif;
  font-size: 28px;
  letter-spacing: 0.2em;
  color: var(--silver);
  margin-bottom: 6px;
}
.login-sub { font-size: 12px; color: var(--muted); margin-bottom: 28px; }
.login-box input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 12px 16px;
  color: var(--white);
  font-size: 14px;
  margin-bottom: 14px;
  outline: none;
  transition: border-color 0.2s;
}
.login-box input:focus { border-color: var(--silver); }
.login-error { font-size: 12px; color: var(--red); margin-bottom: 12px; display: none; }

/* ── ADMIN PANEL ── */
#admin-panel { display: none; padding: 0 0 60px; }

.admin-nav {
  position: sticky; top: 0;
  background: rgba(8,8,8,0.95);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 16px 24px;
  display: flex; align-items: center; justify-content: space-between;
  z-index: 100;
}
.admin-brand { font-family: 'Rajdhani', sans-serif; font-size: 18px; letter-spacing: 0.2em; color: var(--silver); }
.admin-badge { font-size: 10px; color: var(--muted); letter-spacing: 0.1em; }

.admin-body { padding: 24px; max-width: 800px; margin: 0 auto; }

/* ── BUTTONS ── */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 20px;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  border: none;
  transition: opacity 0.2s, transform 0.15s;
}
.btn:hover { opacity: 0.85; transform: translateY(-1px); }
.btn-silver { background: var(--silver); color: #080808; }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--muted); }
.btn-outline:hover { border-color: var(--silver); color: var(--silver); }
.btn-red { background: transparent; border: 1px solid rgba(239,68,68,0.3); color: var(--red); }
.btn-red:hover { background: rgba(239,68,68,0.1); border-color: var(--red); }
.btn-green { background: var(--green); color: #080808; }
.btn-sm { padding: 7px 14px; font-size: 11px; }

/* ── ADD FORM ── */
.section-title {
  font-family: 'Rajdhani', sans-serif;
  font-size: 20px;
  letter-spacing: 0.08em;
  color: var(--white);
  margin-bottom: 16px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}
.add-form {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 24px;
  margin-bottom: 36px;
}
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group label { font-size: 11px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.form-group input, .form-group select {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 10px 14px;
  color: var(--white);
  font-size: 13px;
  outline: none;
  transition: border-color 0.2s;
  width: 100%;
}
.form-group input:focus, .form-group select:focus { border-color: var(--silver); }
.form-group select option { background: #1a1a1a; }
.form-hint { font-size: 10px; color: var(--muted); margin-top: 3px; }

/* thumb preview */
.thumb-preview {
  width: 60px; height: 80px;
  border-radius: 4px;
  object-fit: cover;
  border: 1px solid var(--border);
  background: var(--bg);
  display: none;
}

/* color swatches */
.color-swatches { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.swatch {
  width: 24px; height: 24px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
  transition: border-color 0.2s, transform 0.15s;
}
.swatch:hover { transform: scale(1.15); }
.swatch.active { border-color: #fff; }

/* ── VIDEO LIST ── */
.video-list { display: flex; flex-direction: column; gap: 10px; }
.video-item {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  transition: border-color 0.2s;
}
.video-item:hover { border-color: rgba(192,192,192,0.2); }
.video-thumb-small {
  width: 48px; height: 64px;
  border-radius: 4px;
  object-fit: cover;
  flex-shrink: 0;
  background: var(--bg);
}
.video-info { flex: 1; min-width: 0; }
.video-item-title { font-size: 13px; font-weight: 500; color: var(--white); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
.video-item-meta { font-size: 11px; color: var(--muted); display: flex; gap: 10px; align-items: center; }
.cat-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 20px;
  font-size: 10px;
  letter-spacing: 0.06em;
  font-weight: 600;
}
.cat-personal { background: rgba(192,192,192,0.1); color: var(--silver); }
.cat-client { background: rgba(0,212,255,0.1); color: #00d4ff; }
.video-glow-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.video-actions { display: flex; gap: 8px; flex-shrink: 0; }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 24px; right: 24px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px 20px;
  font-size: 13px;
  z-index: 9999;
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.3s, transform 0.3s;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast.success { border-color: rgba(34,197,94,0.4); color: var(--green); }
.toast.error { border-color: rgba(239,68,68,0.4); color: var(--red); }

/* ── EMPTY STATE ── */
.empty-state { text-align: center; padding: 48px; color: var(--muted); font-size: 13px; }

/* ── TABS ── */
.tabs { display: flex; gap: 0; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
.tab {
  padding: 10px 20px;
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color 0.2s, border-color 0.2s;
  margin-bottom: -1px;
}
.tab.active { color: var(--silver); border-bottom-color: var(--silver); }

@media (max-width: 600px) {
  .form-row { grid-template-columns: 1fr; }
  .admin-body { padding: 16px; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">ZORTHIQ</div>
    <div class="login-sub">Admin Panel</div>
    <input type="password" id="pwd-input" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
    <div class="login-error" id="login-error">Wrong password</div>
    <button class="btn btn-silver" style="width:100%" onclick="doLogin()">Enter</button>
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="admin-panel">
  <div class="admin-nav">
    <div>
      <div class="admin-brand">ZORTHIQ</div>
      <div class="admin-badge">Admin Panel</div>
    </div>
    <button class="btn btn-outline btn-sm" onclick="doLogout()">Logout</button>
  </div>

  <div class="admin-body">

    <!-- ADD VIDEO FORM -->
    <div class="section-title">Add New Video</div>
    <div class="add-form">
      <div class="form-row">
        <div class="form-group">
          <label>YouTube ID *</label>
          <input type="text" id="f-ytid" placeholder="e.g. bCnkv6AwDXw" oninput="previewThumb()">
          <span class="form-hint">Last part of YouTube URL after /shorts/ or ?v=</span>
        </div>
        <div style="display:flex;align-items:flex-end;padding-bottom:22px;">
          <img id="thumb-prev" class="thumb-preview" alt="thumbnail">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Title *</label>
          <input type="text" id="f-title" placeholder="Video title">
        </div>
        <div class="form-group">
          <label>Category *</label>
          <select id="f-cat">
            <option value="personal">Personal Edit</option>
            <option value="client">Client Work</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Views Badge</label>
          <input type="text" id="f-views" placeholder="e.g. 55K+ views (optional)">
        </div>
        <div class="form-group">
          <label>Sort Order</label>
          <input type="number" id="f-order" placeholder="0" value="0">
          <span class="form-hint">Lower number = shown first</span>
        </div>
      </div>
      <div class="form-group" style="margin-bottom:20px;">
        <label>Glow Color</label>
        <input type="text" id="f-glow" placeholder="#C0C0C0" value="#C0C0C0">
        <div class="color-swatches" id="swatches"></div>
      </div>
      <button class="btn btn-silver" onclick="addVideo()">+ Add Video</button>
    </div>

    <!-- VIDEO LIST -->
    <div class="tabs">
      <div class="tab active" onclick="switchTab('personal',this)">Personal Edits (<span id="cnt-personal">0</span>)</div>
      <div class="tab" onclick="switchTab('client',this)">Client Work (<span id="cnt-client">0</span>)</div>
    </div>

    <div class="video-list" id="video-list">
      <div class="empty-state">Loading videos...</div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://ysirwuddenpelgpfytga.supabase.co';
const SUPABASE_KEY = 'sb_publishable_kcak4g2qE_nb4DclftFAcQ_Sb7mKjrE';
const ADMIN_PASS = 'Ogquil';

const _sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let allVideos = [];
let currentTab = 'personal';

// ── AUTH ──
function doLogin() {
  const val = document.getElementById('pwd-input').value;
  if (val === ADMIN_PASS) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-panel').style.display = 'block';
    initSwatches();
    fetchVideos();
  } else {
    document.getElementById('login-error').style.display = 'block';
    document.getElementById('pwd-input').value = '';
  }
}
function doLogout() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('admin-panel').style.display = 'none';
  document.getElementById('pwd-input').value = '';
}

// ── SWATCHES ──
const PRESET_COLORS = [
  '#C0C0C0','#ff0033','#4a90d9','#6ec8ff','#e8375c',
  '#00d4ff','#22c55e','#f59e0b','#a855f7','#f97316',
  '#ec4899','#14b8a6'
];
function initSwatches() {
  const wrap = document.getElementById('swatches');
  wrap.innerHTML = '';
  PRESET_COLORS.forEach(c => {
    const s = document.createElement('div');
    s.className = 'swatch';
    s.style.background = c;
    s.title = c;
    s.onclick = () => {
      document.getElementById('f-glow').value = c;
      document.querySelectorAll('.swatch').forEach(x => x.classList.remove('active'));
      s.classList.add('active');
    };
    wrap.appendChild(s);
  });
}

// ── THUMB PREVIEW ──
function previewThumb() {
  const id = document.getElementById('f-ytid').value.trim();
  const prev = document.getElementById('thumb-prev');
  if (id.length > 5) {
    prev.src = 'https://img.youtube.com/vi/'+id+'/mqdefault.jpg';
    prev.style.display = 'block';
  } else {
    prev.style.display = 'none';
  }
}

// ── FETCH VIDEOS ──
async function fetchVideos() {
  const { data, error } = await _sb.from('videos').select('*').order('sort_order');
  if (error) { showToast('Error loading videos', 'error'); return; }
  allVideos = data || [];
  document.getElementById('cnt-personal').textContent = allVideos.filter(v=>v.category==='personal').length;
  document.getElementById('cnt-client').textContent = allVideos.filter(v=>v.category==='client').length;
  renderList();
}

// ── RENDER LIST ──
function renderList() {
  const list = document.getElementById('video-list');
  const filtered = allVideos.filter(v => v.category === currentTab);
  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-state">No videos yet — add one above!</div>';
    return;
  }
  list.innerHTML = '';
  filtered.forEach(v => {
    const item = document.createElement('div');
    item.className = 'video-item';
    item.innerHTML =
      '<img class="video-thumb-small" src="https://img.youtube.com/vi/'+v.youtube_id+'/mqdefault.jpg" alt="">' +
      '<div class="video-info">' +
        '<div class="video-item-title">'+v.title+'</div>' +
        '<div class="video-item-meta">' +
          '<span class="cat-badge '+(v.category==='personal'?'cat-personal':'cat-client')+'">'+(v.category==='personal'?'Personal':'Client')+'</span>' +
          (v.views_badge ? '<span>'+v.views_badge+'</span>' : '') +
          '<span>order: '+v.sort_order+'</span>' +
        '</div>' +
      '</div>' +
      '<div style="width:12px;height:12px;border-radius:50%;background:'+v.glow_color+';flex-shrink:0;box-shadow:0 0 6px '+v.glow_color+'"></div>' +
      '<div class="video-actions">' +
        '<button class="btn btn-red btn-sm" onclick="deleteVideo('+v.id+')">Delete</button>' +
      '</div>';
    list.appendChild(item);
  });
}

// ── ADD VIDEO ──
async function addVideo() {
  const ytid = document.getElementById('f-ytid').value.trim();
  const title = document.getElementById('f-title').value.trim();
  const cat = document.getElementById('f-cat').value;
  const views = document.getElementById('f-views').value.trim();
  const order = parseInt(document.getElementById('f-order').value) || 0;
  const glow = document.getElementById('f-glow').value.trim() || '#C0C0C0';

  if (!ytid || !title) { showToast('YouTube ID and Title are required', 'error'); return; }

  const { error } = await _sb.from('videos').insert([{
    youtube_id: ytid,
    title: title,
    category: cat,
    views_badge: views,
    sort_order: order,
    glow_color: glow
  }]);

  if (error) { showToast('Error: ' + error.message, 'error'); return; }

  showToast('Video added!', 'success');
  document.getElementById('f-ytid').value = '';
  document.getElementById('f-title').value = '';
  document.getElementById('f-views').value = '';
  document.getElementById('f-order').value = '0';
  document.getElementById('f-glow').value = '#C0C0C0';
  document.getElementById('thumb-prev').style.display = 'none';
  document.querySelectorAll('.swatch').forEach(x => x.classList.remove('active'));
  fetchVideos();
}

// ── DELETE VIDEO ──
async function deleteVideo(id) {
  if (!confirm('Delete this video?')) return;
  const { error } = await _sb.from('videos').delete().eq('id', id);
  if (error) { showToast('Delete failed', 'error'); return; }
  showToast('Deleted!', 'success');
  fetchVideos();
}

// ── TABS ──
function switchTab(cat, el) {
  currentTab = cat;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderList();
}

// ── TOAST ──
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type || '');
  setTimeout(() => { t.className = 'toast'; }, 3000);
}

// Enter key on password
document.getElementById('pwd-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
